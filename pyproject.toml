[project]
name = "infrastructure-agent"
version = "0.1.0"
description = "AI Native Infrastructure Operations Platform — Kubernetes 智能故障诊断 Agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Infrastructure Agent Team" },
]
keywords = [
    "sre",
    "kubernetes",
    "aiops",
    "langgraph",
    "mcp",
    "rca",
    "troubleshooting",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=0.2.0",
    "openai>=1.50.0",
    "kubernetes>=31.0.0",
    "mcp>=1.0.0",
    "pydantic-settings>=2.5.0",
    "uvicorn>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infrastructure_agent"]
